<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Treino a Dois</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: phone-first single column; "today" hero, numbered exercise list, full-screen exercise sheet, fixed bottom tab bar. The UI takes the color of whoever is training. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --raised:#F6F7F3; --line:#E1E4DE; --ink:#11171C; --muted:#5C6871; --faint:#9AA3AA;
  --pa:#2F55E4; --pb:#E2513C; --ok:#1C9A60; --mus:#E2432B; --mus2:#E9B416;
  --plate:#FFFFFF; --img-filter:none; --img-blend:multiply; --shadow:0 1px 2px rgb(17 23 28/.05),0 8px 28px rgb(17 23 28/.07);
  --body:#3E4C55; --eq:#C4CBC4; --tool:#9A5B22; --skin:#C9936E; --skin2:#B07D5B; --cloth:#344A86; --shorts:#232D35; --shoe:#151B20; --hair:#2B211B;
  --me:var(--pa);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1216; --surface:#151C22; --raised:#1C252C; --line:#26313A; --ink:#ECF0F2; --muted:#94A1AB; --faint:#5E6A74;
  --pa:#7C96FF; --pb:#FF856F; --ok:#4FD391; --mus:#FF5A3C; --mus2:#F7CB45;
  --plate:#1C252C; --img-filter:invert(1); --img-blend:screen; --shadow:none;
  --body:#B9C4CA; --eq:#3A454E; --tool:#E0A062; --skin:#D09A74; --skin2:#B5835F; --cloth:#6E88D6; --shorts:#5B6875; --shoe:#A7B0B7; --hair:#4A3A30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1216; --surface:#151C22; --raised:#1C252C; --line:#26313A; --ink:#ECF0F2; --muted:#94A1AB; --faint:#5E6A74;
  --pa:#7C96FF; --pb:#FF856F; --ok:#4FD391; --mus:#FF5A3C; --mus2:#F7CB45;
  --plate:#1C252C; --img-filter:invert(1); --img-blend:screen; --shadow:none;
  --body:#B9C4CA; --eq:#3A454E; --tool:#E0A062; --skin:#D09A74; --skin2:#B5835F; --cloth:#6E88D6; --shorts:#5B6875; --shoe:#A7B0B7; --hair:#4A3A30; color-scheme:dark}
body.me-b{--me:var(--pb)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num,.tnum{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--pa) 50%,var(--pb) 50%)}
.logo img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.brand>div{min-width:0}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em;text-transform:uppercase;display:block;line-height:1}
.brand small{font-size:12px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap}
.who{flex:none;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.av{border:0;background:transparent;border-radius:999px;display:flex;align-items:center;gap:7px;padding:3px;font-weight:600;font-size:14px;color:var(--muted)}
.av i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:15px;color:#fff;flex:none}
.av.a i{background:var(--pa)} .av.b i{background:var(--pb)}
.av span{display:none;padding-right:8px;max-width:7.5ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.av[aria-pressed="true"] span{display:inline}
.av[aria-pressed="false"] i{opacity:.55}

/* week strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid transparent;background:var(--surface);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .w{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .n{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day .dots i.a{background:var(--pa)} .day .dots i.b{background:var(--pb)}
.day.today{border-color:var(--line)}
.day.today .w{color:var(--me)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] .w{color:var(--bg);opacity:.75}
.day[aria-pressed="true"] .dots i:not(.a):not(.b){background:color-mix(in srgb,var(--bg) 30%,transparent)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--me)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8.6vw,42px);line-height:.92;text-transform:uppercase;margin:4px 0 0;text-wrap:balance;letter-spacing:.005em}
.hero .src{color:var(--muted);font-size:13px;margin:6px 0 0}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line)} .ring .pr{stroke:var(--me);transition:stroke-dashoffset .5s}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.ring .lbl small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.stat b{font-family:var(--f-display);font-weight:700;font-size:22px;display:block;line-height:1}
.stat small{font-size:12px;color:var(--muted)}
.cta{border:0;border-radius:16px;background:var(--me);color:#fff;font-weight:700;font-size:16px;padding:15px 18px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.cta svg,.btn2 svg{width:20px;height:20px;flex:none}
.cta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta.done{background:var(--raised);color:var(--ok)}
:root[data-theme="dark"] .cta:not(.done){color:#0D1216}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cta:not(.done){color:#0D1216}}
.phase{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--raised);color:var(--ink);white-space:nowrap;border:1px solid var(--line)}

/* exercise list */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 -6px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.06em;margin:0}
.sec-h span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.list li+li{border-top:1px solid var(--line)}
.ex{width:100%;border:0;background:transparent;display:grid;grid-template-columns:22px 64px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 12px;text-align:left}
.ex .k{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--faint)}
.plate{background:var(--plate);border-radius:12px;position:relative;overflow:hidden;isolation:isolate}
.plate img{filter:none;mix-blend-mode:normal}
.ex .plate{width:64px;height:58px;display:grid;place-items:center}
.ex .plate img{width:100%;height:100%;object-fit:cover}
.ex .t{min-width:0}
.ex .t b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.ex .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .t small em{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);margin-right:4px}
.ex .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ex .last{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap}
.ex .last.none{color:var(--faint);font-weight:600}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.ck.part{border-color:var(--me);background:conic-gradient(var(--me) var(--p),transparent 0)}
.ck.full{border-color:var(--ok);background:var(--ok);color:#fff}
.ck svg{width:13px;height:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:22px;text-align:center;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:592px;width:100%;margin:0 auto}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon svg{width:18px;height:18px}
.steps{flex:1;display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.d{background:var(--ok)} .steps i.c{background:var(--me)}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-in{max-width:560px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.pic{width:100%;aspect-ratio:3/2;max-height:min(48vh,420px);cursor:pointer;background:#000}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;padding:0}
.pic .p1{animation:show1 2s step-end infinite}.pic .p0{animation:show0 2s step-end infinite}
.pic .seg{position:absolute;left:12px;bottom:12px;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.pic .seg span{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;color:var(--muted)}
.pic .seg .s0{animation:on0 2s step-end infinite}.pic .seg .s1{animation:on1 2s step-end infinite}
@keyframes show1{0%{visibility:hidden}50%{visibility:visible}}
@keyframes show0{0%{visibility:visible}50%{visibility:hidden}}
@keyframes on0{0%{background:var(--ink);color:var(--bg)}50%{background:transparent;color:var(--muted)}}
@keyframes on1{0%{background:transparent;color:var(--muted)}50%{background:var(--ink);color:var(--bg)}}
.pic.paused *{animation-play-state:paused!important}
.pic .hint{position:absolute;right:12px;bottom:14px;font-size:11px;color:var(--muted)}
.sh-title h2{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance}
.sh-title p{margin:6px 0 0;color:var(--muted);font-size:14px}
.musrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.minifig{width:96px;flex:none;aspect-ratio:240/170;background:var(--raised);border-radius:10px}
.mleg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.mlab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:100%}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.mchip i{width:9px;height:9px;border-radius:50%}
.mchip i.m1{background:var(--mus)} .mchip i.m2{background:var(--mus2)}
.tip{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--me) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--me) 28%,var(--line));border-radius:14px;padding:11px 13px;font-size:14px}
.tip svg{width:18px;height:18px;flex:none;color:var(--me);margin-top:1px}
.sets{display:flex;flex-direction:column;gap:8px}
.sets .hd,.sets .r{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.sets .hd span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sets .r .n{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--faint);text-align:center}
.sets input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-family:var(--f-display);font-size:22px;font-weight:700;text-align:center}
.sets input::placeholder{color:var(--faint)}
.sets .r.ok input{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.sets .r.ok .n{color:var(--ok)}
.tick{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--faint)}
.tick svg{width:20px;height:20px}
.r.ok .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.other{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.other b{color:var(--ink);font-weight:600}
.how{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.how summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.how summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
.how[open] summary::after{content:"–"}
.how ul{margin:10px 0 8px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.how a{color:var(--me);font-weight:700;text-decoration:none;font-size:14px}
.sh-foot{border-top:1px solid var(--line);background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.sh-foot .cta{flex:1;min-width:0}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
.btn2 svg{width:18px;height:18px}
.linkbtn{border:0;background:none;color:var(--me);font-weight:700;padding:0;font-size:14px}

/* rest pill */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgb(0 0 0/.25)}
.sheet-open .rest{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.rest .rr{width:38px;height:38px;position:relative}
.rest .rr svg{width:100%;height:100%;transform:rotate(-90deg)}
.rest .rr .tr{stroke:color-mix(in srgb,var(--bg) 25%,transparent)} .rest .rr .pr{stroke:var(--me)}
.rest .tm{font-family:var(--f-display);font-weight:800;font-size:24px;min-width:56px}
.rest .tl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;display:block;line-height:1}
.rest button{border:0;background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg);border-radius:999px;padding:9px 13px;font-weight:700;font-size:13px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--faint)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--me)}

/* run */
.runbox{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:var(--shadow)}
.bigring{width:min(240px,70vw);aspect-ratio:1;position:relative}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .tr{stroke:var(--line)} .bigring .pr{stroke:var(--me)}
.bigring .run-p{stroke:var(--pb)} .bigring .walk-p{stroke:var(--pa)}
.bigring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.bigring .ph{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.bigring .clk{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1}
.bigring .nx{font-size:12px;color:var(--muted);margin-top:4px}
.seq{display:flex;gap:3px;width:100%}
.seq i{flex:var(--w);height:6px;border-radius:3px;background:var(--line)}
.seq i.r{background:color-mix(in srgb,var(--pb) 35%,var(--line))} .seq i.w{background:color-mix(in srgb,var(--pa) 30%,var(--line))}
.seq i.r.d{background:var(--pb)} .seq i.w.d{background:var(--pa)}
.seq i.cur{outline:2px solid var(--ink);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mark{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;text-align:left;min-width:0}
.mark i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line)}
.mark.a.on i{background:var(--pa);border-color:var(--pa);color:#fff}.mark.b.on i{background:var(--pb);border-color:var(--pb);color:#fff}
.mark i svg{width:13px;height:13px}
.mark span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.tile b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;display:block}
.tile small{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.heat .h{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--raised);border:1px solid var(--line)}
.heat i.l{background:var(--me);border-color:var(--me)}
.heat i.r{background:color-mix(in srgb,var(--me) 35%,var(--raised));border-color:transparent}
.heat i.fut{opacity:.35}
.heat i.td{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.evo{list-style:none;margin:0;padding:0}
.evo li{display:grid;grid-template-columns:1fr 84px 70px;gap:10px;align-items:center;padding:10px 0}
.evo li+li{border-top:1px solid var(--line)}
.evo b{font-weight:600;font-size:14px;display:block;line-height:1.25}
.evo small{color:var(--muted);font-size:12px}
.evo svg{width:84px;height:28px;overflow:visible}
.evo .v{text-align:right}
.evo .v b{font-family:var(--f-display);font-size:19px;font-weight:800}
.up{color:var(--ok);font-weight:700}


/* diet */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macros .tile{padding:11px 10px}
.macros .tile b{font-size:24px}
@media (max-width:380px){.macros{grid-template-columns:repeat(2,1fr)}}
.macros .tile.k b{color:var(--me)}
.why{font-size:14px;color:var(--body);margin:8px 0 0}
.water{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.water button{width:30px;height:38px;border-radius:6px 6px 10px 10px;border:2px solid var(--line);background:var(--surface);padding:0;position:relative;overflow:hidden}
.water button.on{border-color:var(--me);background:linear-gradient(to top,color-mix(in srgb,var(--me) 55%,var(--surface)) 80%,var(--surface) 80%)}
.meals{display:flex;flex-direction:column;gap:10px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;box-shadow:var(--shadow)}
.meal.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.meal .mh{grid-column:1;grid-row:1;align-self:center;display:flex;align-items:baseline;gap:8px;min-width:0}
.meal .mh time{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--me)}
.meal .mh b{font-weight:700;font-size:15px}
.meal ul{grid-column:1/-1;margin:2px 0 0;padding-left:18px;font-size:14px;color:var(--body);display:flex;flex-direction:column;gap:2px}
.meal .kc{grid-column:1/-1;font-size:12px;color:var(--muted)}
.meal .mbtn{border:0;background:none;padding:0;grid-column:2;grid-row:1}
.meal .mbtn .ck{width:30px;height:30px}
.swap{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.swap b{font-weight:700}
/* foto da refeição */
.eat{display:flex;flex-direction:column;gap:8px}
.eat .bar{height:10px;border-radius:5px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.eat .bar i{display:block;height:100%;background:var(--me);border-radius:5px;transition:width .4s}
.eat .bar i.over{background:var(--mus)}
.eat .nums{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.eat .nums b{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.eat .nums small{font-size:12.5px;color:var(--muted);text-align:right}
.eat .mac{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.eat .mac b{color:var(--ink);font-weight:700}
.snap{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:100%}
.snapbtn{border:0;border-radius:16px;background:var(--me);color:#fff;font-weight:700;font-size:16px;padding:15px 18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.snapbtn svg{width:22px;height:22px;flex:none}
.pick-in{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
:root[data-theme="dark"] .snapbtn{color:#0D1216}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .snapbtn{color:#0D1216}}
.snap .alt{display:flex;gap:8px}
.snap .alt input{flex:1;min-width:0;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 12px;font-size:15px}
.snap .alt button{flex:none}
.app>*{min-width:0;max-width:100%}
.mpick{width:100%;min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mpick::-webkit-scrollbar{display:none}
.mpick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.mpick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.res{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}
.res img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:var(--raised)}
.res.noimg{grid-template-columns:1fr}
.res .busy{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;min-height:84px}
.res .busy i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--me);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.res .tot{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.res .tot small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.items li{display:flex;justify-content:space-between;gap:10px}
.items li span{color:var(--body);min-width:0}
.items li em{font-style:normal;color:var(--muted);font-size:12.5px}
.items li b{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.res .obs{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.res .err{font-size:14px;color:var(--mus)}
.acts{display:flex;gap:8px;grid-column:1/-1}
.acts .cta{padding:12px 14px;font-size:15px}
.acts .btn2{padding:12px 14px}
.ate{grid-column:1/-1;margin-top:4px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.ate .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--me)}
.ate .x{border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:2px 0;text-transform:none;letter-spacing:0}
.atepic{display:flex;align-items:flex-end;gap:8px}
.atepic img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--raised)}
.atepic small{font-size:11.5px;color:var(--muted)}
.meal.swapped>ul{opacity:.45;text-decoration:line-through;text-decoration-color:var(--faint)}
.meal.swapped>.kc{text-decoration:line-through}
.extras{display:flex;flex-direction:column;gap:10px}

/* settings */
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form input:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.form input{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500;width:100%;min-width:0}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--muted)}
.note a{color:inherit}
.steps-list{margin:8px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;max-width:min(92vw,460px);box-shadow:0 10px 30px rgb(0 0 0/.2)}

/* figure classes */
svg .b1{fill:var(--body)} svg .sk{fill:var(--skin)} svg .cl{fill:var(--cloth)} svg .so{fill:var(--shorts)} svg .shoe{fill:var(--shoe)} svg .hair{fill:var(--hair)} svg .ear{fill:var(--skin2)}
svg .m1{fill:var(--mus)} svg .m2{fill:var(--mus2)} svg .eq{fill:var(--eq)} svg .eqs{stroke:var(--eq)} svg .tl{fill:var(--tool)} svg .tls{stroke:var(--tool)} svg .hub{fill:var(--surface)} svg .cab{stroke:var(--muted)} svg .fl{stroke:var(--line)}
svg .vlbl{fill:var(--muted);font:700 10px var(--f-body);letter-spacing:.08em}
@media (prefers-reduced-motion: reduce){
  .sheet{animation:none}
  .pic{aspect-ratio:2/1}.pic img{width:50%;animation:none!important;visibility:visible!important}.pic .p1{left:50%}.pic .seg,.pic .hint{display:none}
}
</style>

function torsoFront(hip,neck){

  const c1=mc('chest','');if(c1)for(const sg of[1,-1])d+=`<path class="${c1}" d="${smooth([...range(.6,.93).map(s=>pt(s,sg*prof(TW,s)*.92)),...range(.6,.93).reverse().map(s=>pt(s,sg*1.5))])}"/>`;

function armSVG(sh,el,wr,sd){
  return limb(sh,el,5.6,4.2,'sk')+limb(el,wr,4.2,2.9,'sk')+ci(wr,3.8,'sk')
   +belly(sh,el,sd,4.9,.14,.82,2.1,mc('bi'))+belly(sh,el,-sd,4.9,.1,.86,2.3,mc('tri'))+belly(el,wr,sd,3.6,.04,.55,1.9,mc('forearm'));
}
function legSVG(hp,kn,an,to,sd,front){
  let pre=limb(hp,kn,8.6,5.6,'sk')+limb(kn,an,5.3,3.3,'sk'),post='';
  const add=(str,k)=>{if(mc(k)==='sk')pre+=str;else post+=str};
  if(front){const q=mc('quad');if(q!=='sk')post+=limb(vL(hp,kn,.12),vL(hp,kn,.9),6.8,4.6,q);add(belly(hp,kn,sd,7.4,.02,.6,2,mc('abductor')),'abductor')}
  else{add(belly(hp,kn,sd,7.2,.08,.9,2.1,mc('quad')),'quad');add(belly(hp,kn,-sd,7.2,.14,.9,1.9,mc('ham')),'ham');add(belly(kn,an,-sd,4.6,.05,.62,2.4,mc('calf')),'calf')}

}
function topView(kind,t,ex){
  ACT=(ex&&MUS[ex])||{p:[],s:[]};

  const lab='<text x="12" y="20" class="vlbl">VISTA DE CIMA</text><text x="228" y="20" class="vlbl" text-anchor="end">↑ FRENTE</text>';let s='';
  s+=kind==='peck'?'<rect class="eq" x="86" y="112" width="68" height="12" rx="5"/>':'<rect class="eq" x="94" y="78" width="52" height="9" rx="4"/><rect class="eq" x="116" y="87" width="8" height="8"/>';
  const shs=[[144,104],[96,104]];

    const sh=shs[sg===1?0:1];
    if(kind==='peck'){
      const a=0+(-123-0)*t, d=R(a), el=[sh[0]+sg*d[0]*31,sh[1]+d[1]*31];
      s+=limb(sh,el,7,5.6,'sk');

    }else{

      s+=limb(sh,el,6.6,5,'sk')+limb(el,hd,5,3.4,'sk')+ci(hd,4.2,'tl');
    }
  }
  s+=`<ellipse class="cl" cx="120" cy="104" rx="31" ry="16"/>`;
  const ch=mc('chest','b1'),bk=mc('back','b1');
  if(ch!=='b1')s+=`<path class="${ch}" d="M92 103A29 14 0 0 1 148 103L120 101Z"/>`;
  if(bk!=='b1')s+=`<path class="${bk}" d="M92 105A29 14 0 0 0 148 105L120 107Z"/>`;
  s+=ci(shs[0],8.4,mc('delt'))+ci(shs[1],8.4,mc('delt'));

function figInner(an,tool,t,ex){

const SHK='treino-a-dois-planilha',DIRTYK='treino-a-dois-pendentes';
let SHURL='';try{SHURL=localStorage.getItem(SHK)||''}catch(e){}
try{if(/^#(ela|b)(&|$)/i.test(location.hash||'')){state.person='b';localStorage.setItem('treino-a-dois-dela','1')}const m=(location.hash||'').match(/[#&]s=([^&]+)/);if(m){SHURL=decodeURIComponent(m[1]);localStorage.setItem(SHK,SHURL);history.replaceState(null,'',location.pathname+(state.person==='b'?'#ela':''))}}catch(e){}
let SHPIN='';try{SHPIN=localStorage.getItem('treino-a-dois-pin')||''}catch(e){}
function askPin(msg){const v=prompt(msg||'Digite o PIN do Treino a Dois');if(v==null)return false;SHPIN=v.trim();try{localStorage.setItem('treino-a-dois-pin',SHPIN)}catch(e){}return true}
let DIRTY={};try{DIRTY=JSON.parse(localStorage.getItem(DIRTYK)||'{}')}catch(e){}
const SENDING={};let SHSIG='',SHT=null,SHBUSY=false;
const saveDirty=()=>{try{localStorage.setItem(DIRTYK,JSON.stringify(DIRTY))}catch(e){}};
const bodyOf=p=>p==='config/app'?state.cfg:state.logs[p.slice(5)];
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
function initSheets(){
  if(!SHURL){render();return}
  state.sync='wait';render();shPull();
  if(!SHT){SHT=setInterval(shPull,30000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')shPull()});
    window.addEventListener('online',shPull);}
}
async function shPull(){
  if(!SHURL||SHBUSY)return;SHBUSY=true;
  try{
    const r=await fetch(SHURL+(SHURL.includes('?')?'&':'?')+'pin='+encodeURIComponent(SHPIN)+'&t='+Date.now());
    const j=await r.json();
    if(j&&j.erro==='pin'){state.sync='pin';SHBUSY=false;render();if(askPin(SHPIN?'PIN incorreto. Digite o PIN do Treino a Dois':'Digite o PIN do Treino a Dois'))shPull();return}
    if(!j||!j.ok)throw new Error('resposta');
    const was=state.sync;state.sync='on';
    Object.keys(DIRTY).forEach(shSend);
    const sig=JSON.stringify(j.docs||{});
    if(sig!==SHSIG){
      if(typing()){SHBUSY=false;if(was!=='on')render();return}
      SHSIG=sig;const o={};let cfg=null;
      for(const[p,b]of Object.entries(j.docs||{})){if(DIRTY[p])continue;if(p==='config/app')cfg=b;else if(p.startsWith('logs/'))o[p.slice(5)]=b}
      state.logs={...state.logs,...o};
      if(cfg)state.cfg=fixNames({...DEF,...cfg,names:{...DEF.names,...(cfg.names||{})}});
      lsSave();render();
    }else if(was!=='on'&&!typing())render();
  }catch(e){const was=state.sync;state.sync='err';if(was!=='err'&&!typing())render()}
  SHBUSY=false;
}
function shSend(p){
  if(!SHURL||SENDING[p])return;const b=bodyOf(p);if(b==null){delete DIRTY[p];saveDirty();return}
  SENDING[p]=true;const snap=JSON.stringify(b);
  fetch(SHURL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({path:p,body:p.startsWith('logs/')&&b.ex&&EX[b.ex]?{...b,n:EX[b.ex].n,pn:(state.cfg.names||{})[b.p]||''}:b,pin:SHPIN})})
   .then(r=>r.json()).then(j=>{if(j&&j.erro==='pin'){state.sync='pin';throw new Error('pin')}if(!j||!j.ok)throw new Error('falha');
     if(JSON.stringify(bodyOf(p))===snap){delete DIRTY[p];saveDirty()}
     if(state.sync!=='on'){state.sync='on';if(!typing())render()}})
   .catch(()=>{if(state.sync==='pin'){if(!typing())render();return}if(state.sync!=='err'){state.sync='err';if(!typing())render()}})
   .finally(()=>{SENDING[p]=false;if(DIRTY[p]&&state.sync==='on'&&JSON.stringify(bodyOf(p))!==snap)shSend(p)});
}
function writeDoc(path,body){
  lsSave();
  if(!DB){if(SHURL){DIRTY[path]=1;saveDirty();shSend(path)}return}
  if(!canWrite)return;
  WQ[path]=(WQ[path]||Promise.resolve()).then(()=>DB.doc(path).set(body)).catch(e=>{if(e&&e.code==='invalid_argument'){canWrite=false;state.sync='ro'}});

    if(!e||e.st!==429||!/too large/i.test(e.det||''))throw e;

  try{return await call({})}catch(e){if(!e||(e.st!==400&&e.st!==404))throw e}
  /* modelo recusado: procura na conta outros modelos com visão e tenta cada um */

function fotosGet(){let o={};try{o=JSON.parse(localStorage.getItem(PHK)||'{}')||{}}catch(e){}const n=Date.now();let ch=false;for(const k in o){if(!o[k]||n-o[k].t>PH_TTL){delete o[k];ch=true}}if(ch)try{localStorage.setItem(PHK,JSON.stringify(o))}catch(e){}return o}
async function fotoGuardar(id,blob){
  try{const url=URL.createObjectURL(blob);const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});URL.revokeObjectURL(url);
    const k=Math.min(1,320/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const o=fotosGet();o[id]={t:Date.now(),src:cv.toDataURL('image/jpeg',.7)};
    try{localStorage.setItem(PHK,JSON.stringify(o))}catch(e){const ks=Object.keys(o).sort((a,b)=>o[a].t-o[b].t);while(ks.length>1){delete o[ks.shift()];try{localStorage.setItem(PHK,JSON.stringify(o));break}catch(e2){}}}
    render()}catch(e){}
}
setInterval(()=>{const o=fotosGet();if(state.tab==='dieta'&&document.querySelector('.ate img')&&[...document.querySelectorAll('.ate img')].some(i=>!o[i.dataset.fid]))render()},60000);
function fotoReset(){if(FOTO.ctl)try{FOTO.ctl.abort()}catch(e){}if(FOTO.img)URL.revokeObjectURL(FOTO.img);Object.assign(FOTO,{busy:false,res:null,err:'',img:null,blob:null,note:'',meal:null,ctl:null})}

function runPlan(w){

  const n=new Date();n.setHours(0,0,0,0);const dow=(n.getDay()+6)%7,st=new Date(n);st.setDate(n.getDate()-dow-28);

/* ---------- tela do exercício ---------- */
function curList(){const day=DAYS.find(d=>d.k===state.day);return day&&day.ex?day.ex:[]}

    <button class="linkbtn" data-rest="${restFor(ex)}">Iniciar descanso de ${restFor(ex)} s</button>

  </div></div>

function readSets(){const ex=state.sheet,ns=setsFor(EX[ex].s,weekInfo().phase),dd=dayDate(state.day),cur=sessOn(state.person,ex,dd),out=[];
  for(let i=0;i<ns;i++){out.push({kg:num($('#kg-'+i)?.value),r:(v=>v==null?null:Math.round(v))(num($('#rp-'+i)?.value)),ok:!!(cur&&cur.sets[i]&&cur.sets[i].ok)})}return out}
function saveSets(sets){
  const p=state.person,ex=state.sheet,id=docId(p,ex),dd=dayDate(state.day);
  const old=state.logs[id]?JSON.parse(JSON.stringify(state.logs[id])):{p,ex,sessions:[]};
  old.sessions=(old.sessions||[]).filter(s=>s.d!==dd);
  if(sets.some(x=>x.ok||x.kg!=null||x.r!=null))old.sessions.push({d:dd,sets});
  old.sessions.sort((a,b)=>a.d<b.d?-1:1);old.sessions=old.sessions.slice(-60);
  state.logs[id]=old;writeDoc('logs/'+id,old);
}

let AC=null,wake=null;
function beep(f=880,d=.2,n=1){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+i*.28;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.start(t0);o.stop(t0+d)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:120)}catch(e){}}
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wake)wake=await navigator.wakeLock.request('screen');if(!on&&wake){await wake.release();wake=null}}catch(e){}}
let REST=null;

    const rr=$('#rring');if(rr){rr.innerHTML=runRing();$('#rseq').innerHTML=runSeq();const b=$('#rtbtn');if(b)b.textContent=RT.on?'Pausar':RT.i>=RT.ph.length?'Recomeçar':'Começar'}}

let IT=null;document.addEventListener('input',ev=>{if(ev.target.id==='foto-note'){FOTO.note=ev.target.value;return}if(state.sheet&&ev.target.closest('.sets')){clearTimeout(IT);IT=setTimeout(()=>{if(state.sheet){saveSets(readSets());render()}},900)}});
addEventListener('pagehide',()=>{if(state.sheet&&$('.sets'))saveSets(readSets());lsSave()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.sheet&&$('.sets'))saveSets(readSets())});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='foto-note'){ev.preventDefault();FOTO.note=ev.target.value;analisar();return}if(ev.key==='Escape'&&state.sheet){state.sheet=null;renderSheet();render()}});

render();restUI();requestAnimationFrame(loop);initDB();
/* atualização automática: compara a versão publicada com a carregada */
async function checaVersao(){
  if(location.protocol!=='https:')return;
  try{const r=await fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const APPV='([^']+)'/);
    if(m&&m[1]!==APPV){let n=0;try{n=+sessionStorage.getItem('treino-a-dois-upd')||0}catch(e){}
      if(n<2){try{sessionStorage.setItem('treino-a-dois-upd',String(n+1))}catch(e){}location.replace(location.pathname+'?v='+encodeURIComponent(m[1])+location.hash)}}}catch(e){}
}
setTimeout(checaVersao,1500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checaVersao()});
